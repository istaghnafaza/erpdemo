# SEPS — Railway staging/production deploy
# Docs: DEPLOY.md

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node scripts/start-production.mjs"
# Static asset — tidak lewat SSR (andalkan untuk healthcheck Railway)
healthcheckPath = "/pwa-icon.svg"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
