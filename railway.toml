# SEPS — Railway staging/production deploy
# Docs: DEPLOY.md

[build]
builder = "NIXPACKS"
# Jangan ulang `npm ci` — Nixpacks/Railpack sudah install deps di fase install.
# Ulang npm ci di sini memicu EBUSY pada node_modules/.cache (cache mount read-only).
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/login"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
